version: '3.9'

services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.7
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes

  spark:
    image: bitnami/spark:3.5
    depends_on:
      - kafka
    volumes:
      - ./:/app
    working_dir: /app
    command: ["spark-submit", "fog/spark_streaming_job.py"]

  app:
    build: .
    depends_on:
      - kafka
    env_file:
      - .env.example
    volumes:
      - ./:/app
    working_dir: /app
    command: ["bash", "-lc", "./scripts/run_local_pipeline.sh"]

  dashboard:
    build: .
    depends_on:
      - app
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    working_dir: /app
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]

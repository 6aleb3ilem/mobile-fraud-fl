version: "3.9"

services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: mf_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes

  simulator:
    build: .
    container_name: mf_simulator
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./:/app
    command: bash -lc "python simulator/generate_transactions.py --samples 3000 --fraud-ratio 0.12 --output data/raw/transactions.csv && python simulator/producer_kafka.py --csv data/raw/transactions.csv --delay 0.02"

  edge_trainer:
    build: .
    container_name: mf_edge
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./:/app
    command: bash -lc "python edge/local_training.py --csv data/raw/transactions.csv --publish"

  cloud_aggregator:
    build: .
    container_name: mf_cloud
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./:/app
    command: bash -lc "python cloud/fedavg_aggregator.py --expected-updates 3"

  fog_streaming:
    build: .
    container_name: mf_fog
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PYSPARK_SUBMIT_ARGS=--packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1 pyspark-shell
    volumes:
      - ./:/app
    command: bash -lc "python fog/spark_streaming_job.py"

  dashboard:
    build: .
    container_name: mf_dashboard
    depends_on:
      - cloud_aggregator
    ports:
      - "8501:8501"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FRAUD_RISK_THRESHOLD=0.65
    volumes:
      - ./:/app
    command: bash -lc "streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501"

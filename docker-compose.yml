version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  simulator:
    build: .
    depends_on:
      - kafka
    env_file:
      - .env.example
    command: python -m simulator.producer_kafka
    volumes:
      - ./:/app

  edge_nouakchott:
    build: .
    depends_on:
      - kafka
    env_file:
      - .env.example
    command: python -m edge.edge_nouakchott
    volumes:
      - ./:/app

  edge_rosso:
    build: .
    depends_on:
      - kafka
    env_file:
      - .env.example
    command: python -m edge.edge_rosso
    volumes:
      - ./:/app

  edge_kaedi:
    build: .
    depends_on:
      - kafka
    env_file:
      - .env.example
    command: python -m edge.edge_kaedi
    volumes:
      - ./:/app

  cloud_aggregator:
    build: .
    depends_on:
      - kafka
    env_file:
      - .env.example
    command: python -m cloud.fedavg_aggregator
    volumes:
      - ./:/app

  global_model_manager:
    build: .
    depends_on:
      - kafka
    env_file:
      - .env.example
    command: python -m cloud.global_model_manager
    volumes:
      - ./:/app

  fog_streaming:
    build: .
    depends_on:
      - kafka
    env_file:
      - .env.example
    command: python -m fog.spark_streaming_job
    volumes:
      - ./:/app

  dashboard:
    build: .
    depends_on:
      - kafka
      - fog_streaming
    env_file:
      - .env.example
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
